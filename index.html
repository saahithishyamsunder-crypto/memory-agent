<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media Memory Agent</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .card h2 {
            color: #333;
            margin-bottom: 16px;
            font-size: 1.3rem;
        }
        
        .input-group {
            margin-bottom: 16px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-weight: 500;
        }
        
        .input-group input,
        .input-group textarea,
        .input-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        
        .input-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
        }
        
        button:hover {
            background: #5568d3;
        }
        
        button.secondary {
            background: #6c757d;
        }
        
        button.secondary:hover {
            background: #5a6268;
        }
        
        .post-list {
            max-height: 300px;
            overflow-y: auto;
        }
        
        .post-item {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }
        
        .post-item:last-child {
            border-bottom: none;
        }
        
        .post-content {
            color: #333;
            margin-bottom: 8px;
        }
        
        .post-meta {
            font-size: 12px;
            color: #888;
        }
        
        .recommendation-box {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 16px;
            margin-top: 16px;
            border-radius: 4px;
        }
        
        .recommendation-box h3 {
            color: #333;
            margin-bottom: 8px;
            font-size: 1rem;
        }
        
        .recommendation-box p {
            color: #555;
            line-height: 1.6;
        }
        
        .confidence-meter {
            display: flex;
            align-items: center;
            margin-top: 12px;
        }
        
        .confidence-label {
            font-size: 12px;
            color: #666;
            margin-right: 8px;
        }
        
        .confidence-bar {
            flex: 1;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
        }
        
        .confidence-fill {
            height: 100%;
            background: #667eea;
            transition: width 0.3s;
        }
        
        .insight-item {
            padding: 10px;
            background: #f0f0f0;
            border-radius: 6px;
            margin-bottom: 8px;
        }
        
        .insight-pattern {
            font-weight: 600;
            color: #333;
        }
        
        .insight-stats {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }
        
        .demo-section {
            text-align: center;
            margin: 20px 0;
        }
        
        .demo-btn {
            background: #28a745;
        }
        
        .demo-btn:hover {
            background: #218838;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧠 Social Media Memory Agent</h1>
            <p>AI that learns from your past posts to give better recommendations</p>
        </div>
        
        <div class="demo-section">
            <button class="demo-btn" onclick="loadDemoData()">Load Demo Data</button>
        </div>
        
        <div class="grid">
            <!-- Add Post Card -->
            <div class="card">
                <h2>📝 Add Post Memory</h2>
                <div class="input-group">
                    <label>Post Content</label>
                    <textarea id="postContent" placeholder="What did you post?"></textarea>
                </div>
                <div class="input-group">
                    <label>Platform</label>
                    <select id="postPlatform">
                        <option value="twitter">Twitter</option>
                        <option value="linkedin">LinkedIn</option>
                        <option value="instagram">Instagram</option>
                        <option value="facebook">Facebook</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Likes</label>
                    <input type="number" id="postLikes" value="0" min="0">
                </div>
                <div class="input-group">
                    <label>Shares</label>
                    <input type="number" id="postShares" value="0" min="0">
                </div>
                <div class="input-group">
                    <label>Comments</label>
                    <input type="number" id="postComments" value="0" min="0">
                </div>
                <button onclick="addPost()">Save Post Memory</button>
            </div>
            
            <!-- Get Recommendation Card -->
            <div class="card">
                <h2>💡 Get Recommendation</h2>
                <div class="input-group">
                    <label>What do you want to post about?</label>
                    <textarea id="recommendationQuery" placeholder="e.g., What should I post about our new feature?"></textarea>
                </div>
                <button onclick="getRecommendation()">Get AI Recommendation</button>
                <div id="recommendationResult"></div>
            </div>
            
            <!-- View Memories Card -->
            <div class="card">
                <h2>📚 Post Memories</h2>
                <div class="post-list" id="postList">
                    <p style="color: #888;">No posts yet. Add some posts or load demo data.</p>
                </div>
                <button class="secondary" onclick="loadPosts()" style="margin-top: 16px;">Refresh</button>
            </div>
            
            <!-- Insights Card -->
            <div class="card">
                <h2>🔍 Learned Insights</h2>
                <div id="insightsList">
                    <p style="color: #888;">No insights yet. Add more posts to generate insights.</p>
                </div>
                <button class="secondary" onclick="analyzePatterns()" style="margin-top: 16px;">Analyze Patterns</button>
            </div>
        </div>
    </div>
    
    <script>
        async function addPost() {
            const content = document.getElementById('postContent').value;
            const platform = document.getElementById('postPlatform').value;
            const likes = parseInt(document.getElementById('postLikes').value) || 0;
            const shares = parseInt(document.getElementById('postShares').value) || 0;
            const comments = parseInt(document.getElementById('postComments').value) || 0;
            
            if (!content.trim()) {
                alert('Please enter post content');
                return;
            }
            
            const response = await fetch('/api/posts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    content,
                    platform,
                    performance: { likes, shares, comments }
                })
            });
            
            if (response.ok) {
                alert('Post saved successfully!');
                document.getElementById('postContent').value = '';
                document.getElementById('postLikes').value = '0';
                document.getElementById('postShares').value = '0';
                document.getElementById('postComments').value = '0';
                loadPosts();
            }
        }
        
        async function loadPosts() {
            const response = await fetch('/api/posts');
            const posts = await response.json();
            
            const postList = document.getElementById('postList');
            
            if (posts.length === 0) {
                postList.innerHTML = '<p style="color: #888;">No posts yet. Add some posts or load demo data.</p>';
                return;
            }
            
            postList.innerHTML = posts.map(post => `
                <div class="post-item">
                    <div class="post-content">${post.content}</div>
                    <div class="post-meta">
                        ${post.platform} • Score: ${post.score.toFixed(1)} • 
                        ❤️ ${post.likes} • 🔄 ${post.shares} • 💬 ${post.comments}
                    </div>
                </div>
            `).join('');
        }
        
        async function getRecommendation() {
            const query = document.getElementById('recommendationQuery').value || 'What should I post?';
            
            const response = await fetch('/api/recommend', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query })
            });
            
            const recommendation = await response.json();
            
            const resultDiv = document.getElementById('recommendationResult');
            resultDiv.innerHTML = `
                <div class="recommendation-box">
                    <h3>🎯 Recommendation</h3>
                    <p>${recommendation.suggestion}</p>
                    <div class="confidence-meter">
                        <span class="confidence-label">Confidence: ${(recommendation.confidence * 100).toFixed(0)}%</span>
                        <div class="confidence-bar">
                            <div class="confidence-fill" style="width: ${recommendation.confidence * 100}%"></div>
                        </div>
                    </div>
                </div>
            `;
        }
        
        async function analyzePatterns() {
            const response = await fetch('/api/analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            });
            
            const data = await response.json();
            loadInsights();
        }
        
        async function loadInsights() {
            const response = await fetch('/api/insights');
            const insights = await response.json();
            
            const insightsList = document.getElementById('insightsList');
            
            if (insights.length === 0) {
                insightsList.innerHTML = '<p style="color: #888;">No insights yet. Add more posts to generate insights.</p>';
                return;
            }
            
            insightsList.innerHTML = insights.map(insight => `
                <div class="insight-item">
                    <div class="insight-pattern">${insight.pattern}</div>
                    <div class="insight-stats">
                        Success Rate: ${(insight.success_rate * 100).toFixed(0)}% • 
                        Evidence: ${insight.evidence_count} posts
                    </div>
                </div>
            `).join('');
        }
        
        async function loadDemoData() {
            const response = await fetch('/api/demo-data', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            });
            
            const data = await response.json();
            
            if (data.success) {
                alert(`Loaded ${data.posts_added} posts and ${data.conversations_added} conversations!`);
                loadPosts();
                loadInsights();
            }
        }
        
        // Load initial data
        loadPosts();
        loadInsights();
    </script>
</body>
</html>
